name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CPU PyTorch + package
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .[dev]

      - name: Run tests
        run: pytest -q

      - name: Smoke test the CLI pipeline
        run: |
          python -m medasr.cli.synth_data --out-dir data/synth --num 12
          python -m medasr.cli.build_tokenizer \
            --manifests data/synth/train.jsonl data/synth/val.jsonl \
            --out artifacts/tokenizer.json
          python examples/quickstart.py
